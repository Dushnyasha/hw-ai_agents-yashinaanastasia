<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-трекер учебных задач</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f6fb;
      color: #252842;
      font-synthesis: none;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-width: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #a6a9fc;
      outline-offset: 3px;
    }
    .page { width: min(100% - 32px, 760px); margin: 0 auto; padding: 34px 0 58px; }
    .intro { margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: #625aca; font-size: 0.82rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.65rem); letter-spacing: -.045em; line-height: 1.13; }
    .subtitle { margin: 11px 0 0; color: #62677f; font-size: .97rem; line-height: 1.5; }
    .panel { padding: 25px; margin-top: 18px; border: 1px solid #e6e8f2; border-radius: 22px; background: white; box-shadow: 0 10px 34px rgba(37, 40, 66, .045); }
    h2 { font-size: 1.18rem; margin: 0 0 18px; letter-spacing: -.025em; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .stat { padding: 17px; border-radius: 15px; background: #f6f7fc; min-width: 0; }
    .stat-label { color: #686d84; font-size: .86rem; }
    .stat-value { margin-top: 7px; font-size: 1.75rem; font-weight: 760; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .stat.accent { background: #eeecff; color: #4e42b4; }
    .stat.accent .stat-label { color: #6256b0; }
    .progress-track { margin-top: 17px; height: 10px; background: #ebedf5; border-radius: 999px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; border-radius: inherit; background: #7669e9; transition: width .2s ease; }
    .fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, .44fr); gap: 14px; }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 660; }
    .field input { display: block; width: 100%; min-width: 0; padding: 12px 13px; border: 1px solid #ccd0e1; border-radius: 11px; background: #fff; color: #252842; }
    .field input::placeholder { color: #9499ac; }
    .field input[aria-invalid="true"] { border-color: #ce4054; background: #fff9fa; }
    .error { margin: 7px 0 0; color: #ba2944; font-size: .82rem; line-height: 1.4; }
    .error:empty, .notice:empty { display: none; }
    .add-button { margin-top: 17px; min-height: 46px; padding: 11px 20px; border: 0; border-radius: 11px; background: #6559db; color: #fff; font-weight: 700; }
    .add-button:hover { background: #5246c5; }
    .notice { margin: 14px 0 0; padding: 12px 14px; border: 1px solid #f1d9ac; border-radius: 11px; background: #fff9eb; color: #765118; font-size: .87rem; line-height: 1.5; }
    .list-header { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .list-header h2 { margin: 0; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 5px; border-radius: 12px; background: #f3f4fa; }
    .filter { border: 0; padding: 8px 12px; border-radius: 9px; background: transparent; color: #60657e; font-size: .87rem; font-weight: 640; }
    .filter[aria-pressed="true"] { background: #fff; color: #4d43bd; box-shadow: 0 2px 8px rgba(40, 40, 80, .08); }
    .task-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .task { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; min-width: 0; padding: 15px; border: 1px solid #e6e8f1; border-radius: 13px; }
    .task-main { display: flex; align-items: flex-start; gap: 11px; min-width: 0; cursor: pointer; }
    .task-main input { width: 19px; height: 19px; flex: 0 0 19px; margin: 1px 0 0; accent-color: #6559db; cursor: pointer; }
    .task-title { overflow-wrap: anywhere; line-height: 1.35; font-weight: 650; }
    .task.is-done .task-title { color: #8e93a6; text-decoration: line-through; }
    .task-hours { white-space: nowrap; color: #697089; font-size: .9rem; font-variant-numeric: tabular-nums; }
    .remove { padding: 7px 11px; border: 1px solid #e4e5ee; border-radius: 9px; background: #fff; color: #6d7184; font-size: .84rem; }
    .remove:hover { border-color: #ebabb6; color: #b72e49; }
    .empty { padding: 24px 15px; text-align: center; border: 1px dashed #d6d9e9; border-radius: 13px; color: #777c92; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
      .page { width: min(100% - 24px, 760px); padding-top: 24px; }
      .panel { padding: 18px; border-radius: 18px; }
      .fields { grid-template-columns: minmax(0, 1fr); }
      .add-button { width: 100%; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat { padding: 15px; }
      .stat.accent { grid-column: 1 / -1; }
      .task { grid-template-columns: minmax(0, 1fr) auto; }
      .remove { grid-column: 2; grid-row: 2; justify-self: end; }
    }
    @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Учёба · неделя</p>
      <h1>Мой трекер задач</h1>
      <p class="subtitle">Планируйте учебные задачи и отслеживайте прогресс по часам.</p>
    </header>

    <section class="panel" aria-labelledby="summary-heading">
      <h2 id="summary-heading">Прогресс за неделю</h2>
      <div class="stats">
        <div class="stat"><div class="stat-label">Всего часов</div><div class="stat-value" id="total-hours">8 ч</div></div>
        <div class="stat"><div class="stat-label">Выполнено</div><div class="stat-value" id="done-hours">2 ч</div></div>
        <div class="stat accent"><div class="stat-label">Прогресс</div><div class="stat-value" id="progress-value">25%</div></div>
      </div>
      <div class="progress-track" id="progress-bar" role="progressbar" aria-label="Выполнение учебных задач" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Добавить задачу</h2>
      <form id="task-form" novalidate>
        <div class="fields">
          <div class="field">
            <label for="task-title">Название задачи</label>
            <input id="task-title" name="title" type="text" placeholder="Например, Конспект лекции" autocomplete="off" aria-describedby="title-error">
            <p class="error" id="title-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="task-hours">Часы (0,5–24; шаг 0,5)</label>
            <input id="task-hours" name="hours" type="text" inputmode="decimal" placeholder="Например, 1,5" autocomplete="off" aria-describedby="hours-error">
            <p class="error" id="hours-error" role="alert"></p>
          </div>
        </div>
        <button class="add-button" type="submit">Добавить задачу</button>
      </form>
      <p class="notice" id="storage-notice" role="status"></p>
    </section>

    <section class="panel" aria-labelledby="tasks-heading">
      <div class="list-header">
        <h2 id="tasks-heading">Список задач</h2>
        <div class="filters" role="group" aria-label="Фильтр задач">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">Все</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Активные</button>
          <button class="filter" type="button" data-filter="done" aria-pressed="false">Готовые</button>
        </div>
      </div>
      <ul class="task-list" id="task-list"></ul>
      <p class="empty" id="empty-state" hidden>По выбранному фильтру задач нет.</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const storageKey = 'weekly-study-tracker-v2';
      const starterTasks = [
        { id: 1, title: 'Чтение', hours: 2, done: true },
        { id: 2, title: 'Практика', hours: 4, done: false },
        { id: 3, title: 'Повторение', hours: 2, done: false }
      ];

      const form = document.getElementById('task-form');
      const titleInput = document.getElementById('task-title');
      const hoursInput = document.getElementById('task-hours');
      const titleError = document.getElementById('title-error');
      const hoursError = document.getElementById('hours-error');
      const list = document.getElementById('task-list');
      const emptyState = document.getElementById('empty-state');
      const storageNotice = document.getElementById('storage-notice');
      const filterButtons = document.querySelectorAll('[data-filter]');

      let tasks = starterTasks.map(task => ({ ...task }));
      let currentFilter = 'all';
      let storageAvailable = true;
      let nextId = 4;

      function validHours(value) {
        return Number.isFinite(value) && value >= 0.5 && value <= 24 && Number.isInteger(value * 2);
      }

      function parseHours(raw) {
        const value = raw.trim();
        if (value === '') return { error: 'Укажите количество часов.' };
        if (!/^\d+(?:[.,]\d+)?$/.test(value)) return { error: 'Введите число от 0,5 до 24.' };
        const hours = Number(value.replace(',', '.'));
        if (!Number.isFinite(hours) || hours < 0.5 || hours > 24) {
          return { error: 'Часы должны быть от 0,5 до 24.' };
        }
        if (!validHours(hours)) return { error: 'Используйте шаг 0,5 часа.' };
        return { hours };
      }

      function setError(input, element, message) {
        element.textContent = message;
        input.setAttribute('aria-invalid', message ? 'true' : 'false');
      }

      function isStoredTask(task) {
        return task !== null && typeof task === 'object' &&
          Number.isSafeInteger(task.id) && task.id > 0 &&
          typeof task.title === 'string' && task.title.trim().length > 0 &&
          validHours(task.hours) && typeof task.done === 'boolean';
      }

      function restoreTasks() {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === null) return;
          const restored = JSON.parse(saved);
          if (!Array.isArray(restored) || !restored.every(isStoredTask) ||
              new Set(restored.map(task => task.id)).size !== restored.length) {
            storageNotice.textContent = 'Сохранённые данные некорректны. Загружен стартовый пример.';
            return;
          }
          tasks = restored;
          nextId = Math.max(0, ...tasks.map(task => task.id)) + 1;
        } catch (error) {
          storageAvailable = false;
          storageNotice.textContent = 'Хранилище недоступно. Задачи работают в памяти и могут исчезнуть после закрытия страницы.';
        }
      }

      function saveTasks() {
        if (!storageAvailable) return;
        try {
          localStorage.setItem(storageKey, JSON.stringify(tasks));
        } catch (error) {
          storageAvailable = false;
          storageNotice.textContent = 'Не удалось сохранить задачи. Можно продолжать работу, но изменения останутся только в памяти.';
        }
      }

      function formatHours(value) {
        return String(value).replace('.', ',') + ' ч';
      }

      function renderSummary() {
        const total = tasks.reduce((sum, task) => sum + task.hours, 0);
        const done = tasks.reduce((sum, task) => sum + (task.done ? task.hours : 0), 0);
        const progress = total === 0 ? 0 : Math.round(100 * done / total);
        document.getElementById('total-hours').textContent = formatHours(total);
        document.getElementById('done-hours').textContent = formatHours(done);
        document.getElementById('progress-value').textContent = progress + '%';
        document.getElementById('progress-fill').style.width = progress + '%';
        document.getElementById('progress-bar').setAttribute('aria-valuenow', String(progress));
      }

      function renderList() {
        list.replaceChildren();
        const visible = tasks.filter(task => currentFilter === 'all' ||
          (currentFilter === 'active' && !task.done) ||
          (currentFilter === 'done' && task.done));
        emptyState.hidden = visible.length > 0;

        for (const task of visible) {
          const item = document.createElement('li');
          item.className = 'task' + (task.done ? ' is-done' : '');

          const label = document.createElement('label');
          label.className = 'task-main';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.done;
          checkbox.addEventListener('change', () => {
            task.done = checkbox.checked;
            saveTasks();
            render();
          });
          const name = document.createElement('span');
          name.className = 'task-title';
          name.textContent = task.title;
          label.append(checkbox, name);

          const hours = document.createElement('span');
          hours.className = 'task-hours';
          hours.textContent = formatHours(task.hours);

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'remove';
          remove.textContent = 'Удалить';
          remove.setAttribute('aria-label', 'Удалить задачу «' + task.title + '»');
          remove.addEventListener('click', () => {
            tasks = tasks.filter(entry => entry.id !== task.id);
            saveTasks();
            render();
          });
          item.append(label, hours, remove);
          list.append(item);
        }
      }

      function render() {
        renderSummary();
        renderList();
        for (const button of filterButtons) {
          button.setAttribute('aria-pressed', String(button.dataset.filter === currentFilter));
        }
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const title = titleInput.value.trim();
        const parsed = parseHours(hoursInput.value);
        setError(titleInput, titleError, title ? '' : 'Введите название задачи.');
        setError(hoursInput, hoursError, parsed.error || '');
        if (!title || parsed.error) return;

        tasks.push({ id: nextId++, title, hours: parsed.hours, done: false });
        saveTasks();
        form.reset();
        setError(titleInput, titleError, '');
        setError(hoursInput, hoursError, '');
        render();
      });

      titleInput.addEventListener('input', () => {
        if (titleError.textContent) {
          setError(titleInput, titleError, titleInput.value.trim() ? '' : 'Введите название задачи.');
        }
      });
      hoursInput.addEventListener('input', () => {
        if (hoursError.textContent) {
          setError(hoursInput, hoursError, parseHours(hoursInput.value).error || '');
        }
      });
      for (const button of filterButtons) {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;
          render();
        });
      }

      restoreTasks();
      render();
    })();
  </script>
</body>
</html>
